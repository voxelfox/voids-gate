      .container {
        width: 80%;
        max-width: 300px;
        margin: 10% auto;
        text-align: center;
      }
      .container .logo {
        width: 55%;
        height: auto;
        margin-bottom: 0px;
        margin-left: 0px;
      }
      .container p {
        margin: 0;
        font-family: 'Lato';
        font-size: 1em;
        color: #666;
      }
      .container p1 {
        margin: 0;
        font-family: 'Lato';
        font-size: 1em;
        color: #1b1b1b;
      }
      .container button {
        margin: 0px 0px 0px 0px;
        padding: 10px;
        background-color: #000000;
        border: solid;
        border-radius: 10px;
	    color: #1b1b1b;
        display: inline-block;
 	    line-height: 0px;
        width: 70px;
		height: 25px;
       }
      .container button1 {
        margin: 0px 0px 0px 0px;
        padding: 10px;
        background-color: #2b2b2b;
        border: solid #111;
        border-radius: 10px;
        cursor: pointer;
	    color: #999;
        display: inline-block;
 	    line-height: 20px;
        width: 125px;
		height: 15px;
       }
      .container button1:hover {
        animation: colorShift 1s infinite linear;
       }
      .container button:hover {
        animation: colorShift 1s infinite linear;
       }
		@keyframes colorShift {
		 0% { color:hsl(0,100%,50%);border-color:hsl(0,100%,50%);}
		 16% { color:hsl(60,100%,50%);border-color:hsl(60,100%,50%);}
 		 50% { color:hsl(180,100%,50%);border-color:hsl(180,100%,50%);}
 		 66% { color:hsl(240,100%,50%);border-color:hsl(240,100%,50%);}
 		 83% { color:hsl(300,100%,50%);border-color:hsl(300,100%,50%);}
 		 100% { color:hsl(360,100%,50%);border-color:hsl(360,100%,50%);}
       }
      @media (max-width: 600px) {
        .container {
          width: 95%;
       }
      }
